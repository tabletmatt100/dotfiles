# ~/.tmux.conf - Optimized for Onyx Boox E-ink + Termux (tmux 3.8)

# -----------------------------------------------------------------------------
# 1. E-ink Refresh & Anti-Ghosting
# -----------------------------------------------------------------------------
# Disable periodic status bar redraws (prevents background flicker/ghosting)
set -g status-interval 0

# Disable visual flashes and scrollbars that trigger unnecessary partial refreshes
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g pane-scrollbars off

# Keep status messages visible slightly longer for E-ink response time
set -g display-time 1500

# Enable truecolor so #000000 / #ffffff render without 256-color dithering
set -as terminal-features ",xterm*:RGB,screen*:RGB"

# -----------------------------------------------------------------------------
# 2. High-Contrast Monochrome Theme (#000000 / #ffffff)
# -----------------------------------------------------------------------------
# Status bar: crisp black text on white background, inverted active tab
set -g status-style "bg=#ffffff,fg=#000000"
set -g status-left "[#S] "
set -g status-left-length 20
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#{?window_zoomed_flag,[ZOOM] ,}#{=30:s|^/data/data/com.termux/files/home|~|:pane_current_path}"
set -g status-right-length 45

# Under qemu-aarch64, pane_current_command is always "qemu-aarch64".
# Show the current directory name (~ for home, basename otherwise) instead.
set -g automatic-rename on
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_path},/data/data/com.termux/files/home},~,#{b:pane_current_path}}}#{?pane_dead,[dead],}"

set -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-style "bg=#ffffff,fg=#000000"
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-style "bg=#000000,fg=#ffffff,bold"
set -g window-status-activity-style "underscore,bold"
set -g window-status-bell-style "reverse,bold"
set -g window-status-separator " "

# Pane borders: heavy lines + directional arrows for unmistakable active pane
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-style "fg=#666666"
set -g pane-active-border-style "fg=#000000,bold"

# Messages & command prompt
set -g message-style "bg=#000000,fg=#ffffff,bold"
set -g message-command-style "bg=#ffffff,fg=#000000,underscore,bold"

# Copy mode & search highlights
set -g mode-style "bg=#000000,fg=#ffffff"
set -g copy-mode-selection-style "bg=#000000,fg=#ffffff"
set -g copy-mode-match-style "bg=#000000,fg=#ffffff,underscore"
set -g copy-mode-current-match-style "bg=#000000,fg=#ffffff,bold"
set -g copy-mode-mark-style "underscore,bold"
set -g copy-mode-position-style "bg=#000000,fg=#ffffff"

# Menus, popups, tree mode, and pane numbers (overrides unreadable theme defaults)
set -g menu-style "bg=#ffffff,fg=#000000"
set -g menu-selected-style "bg=#000000,fg=#ffffff,bold"
set -g menu-border-style "bg=#ffffff,fg=#000000"
set -g menu-border-lines single

set -g popup-style "bg=#ffffff,fg=#000000"
set -g popup-border-style "bg=#ffffff,fg=#000000"
set -g popup-border-lines single

set -g tree-mode-border-style "bg=#ffffff,fg=#000000"
set -g tree-mode-selection-style "bg=#000000,fg=#ffffff,bold"

set -g display-panes-colour "#666666"
set -g display-panes-active-colour "#000000"
set -g display-panes-border-style "bg=#ffffff,fg=#000000"
set -g clock-mode-colour "#000000"

# -----------------------------------------------------------------------------
# 3. Tablet & Termux Ergonomics
# -----------------------------------------------------------------------------
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g escape-time 10
set -g repeat-time 600
set -g history-limit 10000

# 1-based indexing matches the number row
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Quick config reload with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Switch windows/tabs with Prefix + Ctrl+n / Ctrl+p (repeatable)
bind -r C-n next-window
bind -r C-p previous-window

# Physical Boox volume/page buttons & Termux bar PGUP/PGDN:
# Scroll 6 lines at a time (about 1/3 screen on Palma 3) so context stays visible,
# and allow ESC or q to exit copy-mode immediately.
bind -n PageUp copy-mode \; send-keys -X -N 6 scroll-up
bind -T copy-mode PageUp send-keys -X -N 6 scroll-up
bind -T copy-mode PageDown send-keys -X -N 6 scroll-down
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode q send-keys -X cancel
bind -T copy-mode-vi PageUp send-keys -X -N 6 scroll-up
bind -T copy-mode-vi PageDown send-keys -X -N 6 scroll-down
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel

# Smooth out touch/finger scrolling on E-ink (1 line per tick instead of 5)
# and unbind accidental touch-drag text selection while scrolling
bind -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e \; send-keys -X -N 1 scroll-up"
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
unbind -n MouseDrag1Pane
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode-vi MouseDrag1Pane
